# Configuration parameters for the apriltag_ros node, which publishes on the /detections topic.
#Apriltag_ros node processes the images through the depth_camera_optical frame, so the tag transforms are in reference to that.
#The transforms are passed from here to detected_dock_pose_publisher.
#These tags are predecesors of the docks, ignorant of the docks. Some of the docks are based on these tags.
#The tag positions given by this node should theoretically be the same as the pose of the simulated tag from driveway.sdf, but they are not programatically linked in any way.
#I'm not sure what would happen if I published a static transform using the driveway.sdf pose in the /map frame. Conflict of some sorts??

#Apriltag generator: https://chaitanyantr.github.io/apriltag.html
#Source code: https://github.com/m11112089/apriltag_ros

/**: # node name. Use /** as a wildcard so that this file is used by whichever node calls it. Params wont load if the name doesnt match.
    ros__parameters:
        image_transport: raw    # Controls image compression - 'raw' means uncompressed images
        family: 36h11           # The type/style of AprilTag - 36h11 is a common, reliable family
        size: 0.08              # default/global tag edge size in meters that will be used for all detected AprilTags unless overridden
        profile: false          # print profiling information to stdout for optimizing and troubleshooting.
        max_hamming: 0          # How many bit errors to tolerate - 0 means no errors allowed, making detection stricter

        # see "apriltag.h" 'struct apriltag_detector' for more documentation on these optional parameters
        #Tuning detections
        detector:
            threads: 1          # How many CPU threads to use - higher numbers can make detection faster
            decimate: 2.0       # Makes image smaller for faster detection (2.0 = use half resolution)
            blur: 0.0           # How much to blur the image - can help with noisy images (0.0 = no blur)
            refine: true        # Whether to fine-tune tag corners for better accuracy
            sharpening: 0.25    # How much to sharpen the image - can help see tag edges better
            debug: false        # Whether to save debug images - useful for troubleshooting

            pose_estimation_method: "pnp" # method for estimating the tag pose

        # optional list of tags
        tag:
            ids:    [0, 1, 2, 3, 4, 5] # Tag IDs from the 36h11 family to watch for. All others, if seen, are ignored.
            frames: [home_ID, trash_bin_ID, recycle_bin_ID, green_bin_ID, trash_return_ID, recycle_return_ID] # These directly relate to the IDs on the above line. When detected, this is the name of the object/frame of the Transform published to /tf. The docks of similar names reference these frames, but these frames are ignorant of the docks.
            sizes:  [0.08, 0.08, 0.08, 0.08, 0.08, 0.08] # tag-specific edge size, overrides the default 'size'.
